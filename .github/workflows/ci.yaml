name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
      - name: Format Check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet
      - name: Test
        run: go test
      - name: Test (Race)
        run: go test -race
      - name: Coverage
        env:
          MIN_COVERAGE: 80
        run: |
          go test -coverprofile=coverage.out
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          echo "Coverage: ${coverage}%"
          awk -v coverage="$coverage" -v min_coverage="$MIN_COVERAGE" 'BEGIN { if (coverage < min_coverage) { print "Coverage is below the minimum of " min_coverage "%"; exit 1 } }'
      - name: Build
        run: go build
